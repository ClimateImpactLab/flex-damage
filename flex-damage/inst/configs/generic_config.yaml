# Generic Damage Function Configuration Template
# Works with any impact variable and sector

# Data settings
data:
  # Path to input data file
  data_path: "/path/to/data.csv"
  
  # Name of the impact variable column in data
  impact_variable: "impact_variable"
  
  # Sector name (used for output directory naming and labeling)
  sector: "sector"

# Output settings
output:
  # Directory where results should be saved
  output_dir: "./results"
  
  # Analysis name (used in output directory name)
  analysis_name: "damage_analysis"

# Data processing settings
data_processing:
  # GDP baseline years for delta calculations
  gdp_baseline_years:
    start: 2010
    end: 2015
  
  # Data aggregation settings
  collapse_batch: true
  
  # Log impact filtering (remove extreme outliers)
  log_impact_quantile_filter: 0.05

# Analysis scenarios
scenarios:
  gamma_filter:
    - "all_gamma_values"
    # - "positive_gamma_only"  # Uncomment to include
  
  weighting:
    - "population_weighted"
    # - "unweighted"  # Uncomment to include

# Model settings
modeling:
  # Fixed effects model type
  augmented_fe: false
  
  # Regional analysis settings
  force_convexity: true
  
  # Minimum observations required per region
  min_regional_obs: 3

# Output file settings  
output_files:
  # Create diagnostic plots
  generate_plots: true
  
  # Save intermediate results
  save_regional_results: true
  
  # Generate comparison tables
  generate_tables: true
  
  # Scale factor for coefficients (adjust based on units)
  scale_factor: 1.0
  
  # Regional comparison settings (optional)
  # Leave empty or comment out if no regional comparison needed
  # regional_comparisons:
  #   USA:
  #     reference_values: [-10.0, 5.0]  # Reference values for 1°C, 2°C impacts
  #   CHN:
  #     reference_values: [15.0, 8.0]
  
  # Plot dimensions
  plot_width: 8.56
  plot_height: 7.93

# Progress reporting
progress:
  show_spinner: true
  show_progress_bar: true