# =============================================================================
# FlexDamage v3 - agriculture wheat_winter_country Country-Level Configuration
# =============================================================================
# Country-resolution analog of wheat_winter.yaml. Same estimation logic,
# different input parquet (country-aggregated) and output naming.

run:
  name: agriculture_wheat_winter_country_ir
  description: "agriculture wheat_winter response estimation - Country resolution"

sector:
  name: agriculture
  subsector: wheat_winter_country
  units: "log_yield_change"
  units_description: "Log change in winter wheat yield (kg/Ha, log scale): country-level rows extracted from the projection system's 5716-region hierarchy aggregated.nc4 file (1% winsorization variant); log_yield_impact = main.rebased - histclim.rebased."
  adaptation: fulladapt
  resolution: country

  source_variable: "rebased (log kg/Ha)"
  source_nc4_main: "wheat_winter-<DDMMYY>-aggregated.nc4 (DDMMYY: 110221=cassava, 160221=corn/rice/soy/sorghum, 280823=wheat*)"
  source_nc4_hist: "wheat_winter-<DDMMYY>-histclim-aggregated.nc4"
  methodology_ref: "CIL 'art of rebasing and histclim' (2020) Section 2.3.1; agriculture-specific 1% winsorization documented in CIL agriculture pipeline"
data:
  source: /scratch/midway3/cadavidsanchez/flex-damages/agriculture/country_keepmc_full/agriculture_wheat_winter_aggregated_country_keepmc_full.parquet
  format: parquet
  collapse_mc: false   # default: keep all MC draws

  columns:
    y: log_yield_impact
    temperature: temperature_anomaly
    income: gdppc
    weight: pop
    region: region
    year: year
    sdev: null
    scenario_columns:
      - rcp
      - ssp

  income_is_log: false

estimation:
  formula: "alpha * T + beta * T**2"

  gamma:
    method: fixed_effects
    backend: fixest        # R fixest (50-200x faster on big keep-MC datasets)
    temperature_bins: 0.5
    cluster_se: true
    include_sign_in_fe: true
    n_quantiles: 19
    trim_percentile: 0.05

  regional:
    min_observations: 5
    ridge_lambda: 1.0e-8

  constraints:
    - parameter: beta
      type: max
      value: 0

output:
  results_dir: /project/cil/gcp/flex_damage_funcs/results/agriculture/wheat_winter_country
  parameters_dir: /project/cil/gcp/flex_damage_funcs/parameters

execution:
  workers: 0
  memory_limit_gb: 60
