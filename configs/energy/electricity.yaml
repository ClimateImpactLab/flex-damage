# =============================================================================
# FlexDamage v3 - Energy Electricity Configuration
# =============================================================================
# Constraint: beta >= 0 (convexity). Electricity use rises with warming (AC),
# accelerating with temperature.

run:
  name: energy_electricity_ir
  description: "Electricity-only energy damages - Impact Region resolution"

sector:
  name: energy
  subsector: electricity
  units: "kWh_per_capita"
  units_description: "kWh per capita, rebased to 2005 baseline (positive = more electricity consumed)"
  adaptation: fulladapt
  source_variable: "rebased (electricity main - histclim)"
  source_nc4_main: "FD_FGLS_inter_OTHERIND_electricity_TINV_clim.nc4"
  source_nc4_hist: "FD_FGLS_inter_OTHERIND_electricity_TINV_clim-histclim.nc4"
  methodology_ref: "The art of rebasing and histclim (CIL, 2020) Section 2.3.1"

data:
  source: /scratch/midway3/cadavidsanchez/flex-damages/energy/full/energy_aggregated_full.parquet
  format: parquet

  columns:
    y: energy_electricity
    temperature: temperature_anomaly
    income: gdppc
    weight: pop
    region: region
    year: year
    sdev: null
    scenario_columns:
      - rcp
      - ssp

  income_is_log: false

estimation:
  formula: "alpha * T + beta * T**2"

  gamma:
    method: fixed_effects
    temperature_bins: 0.5
    cluster_se: true
    include_sign_in_fe: true
    n_quantiles: 19
    trim_percentile: 0.05

  regional:
    min_observations: 10
    ridge_lambda: 1.0e-8

  constraints:
    - parameter: beta
      type: min
      value: 0

output:
  results_dir: /project/cil/gcp/flex_damage_funcs/results/energy/electricity
  parameters_dir: /project/cil/gcp/flex_damage_funcs/parameters

execution:
  workers: 0
  memory_limit_gb: 100
