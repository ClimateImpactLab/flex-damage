# =============================================================================
# FlexDamage v3 - Labor Low-Risk Workers Configuration
# =============================================================================
# Data: aggregated labor damages from build_labor_input.py
# Full-adaptation impact = main.lowriskimpacts - histclim.lowriskimpacts
# Constraint: beta <= 0 (concavity)

run:
  name: labor_low_risk_ir
  description: "Low-risk labor productivity response estimation - Impact Region resolution"

sector:
  name: labor
  subsector: low_risk
  units: "portion"
  units_description: "dimensionless fraction of low-risk-worker labor productivity, rebased to 2005 baseline (negative = productivity loss)"
  adaptation: fulladapt
  source_variable: "lowriskimpacts"
  source_nc4_main: "uninteracted_main_model.nc4"
  source_nc4_hist: "uninteracted_main_model-histclim.nc4"
  methodology_ref: "The art of rebasing and histclim (CIL, 2020), Section 2.3.1 and Addendum Section 4"

data:
  source: /scratch/midway3/cadavidsanchez/flex-damages/labor/full/labor_aggregated_full.parquet
  format: parquet

  columns:
    y: labor_low_risk
    temperature: temperature_anomaly
    income: gdppc
    weight: pop
    region: region
    year: year
    sdev: null
    scenario_columns:
      - rcp
      - ssp

  income_is_log: false

estimation:
  formula: "alpha * T + beta * T**2"

  gamma:
    method: fixed_effects
    temperature_bins: 0.5
    cluster_se: true
    include_sign_in_fe: true
    n_quantiles: 19
    trim_percentile: 0.05

  regional:
    min_observations: 10
    ridge_lambda: 1.0e-8

  constraints:
    - parameter: beta
      type: max
      value: 0

output:
  results_dir: /project/cil/gcp/flex_damage_funcs/results/labor/low_risk
  parameters_dir: /project/cil/gcp/flex_damage_funcs/parameters

execution:
  workers: 0
  memory_limit_gb: 100
