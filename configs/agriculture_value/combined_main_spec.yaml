# =============================================================================
# FlexDamage v3 - Agriculture Value (combined crops, main_spec) Configuration
# =============================================================================
# Data: aggregated (across 6 crops) welfare cost from the agval main_spec
# Monte Carlo output. Already CC-vs-counterfactual (no histclim subtraction
# needed upstream). Variable name: wc_no_reallocation.
#
# Sign: negative = welfare loss (paper's DeltaWelfare convention).
# Note: published partial-SCC tables flip the sign (positive = damage) for
# SCC tables; keep DeltaWelfare convention in estimation and document.
#
# Constraint: beta <= 0 (concavity). Grounded in empirical Fig 3D from the
# paper: quadratic in DeltaGMST with losses accelerating at higher warming.

run:
  name: agriculture_value_combined_main_spec_ir
  description: "Agriculture welfare cost (all crops, main_spec) - Impact Region resolution"

sector:
  name: agriculture_value
  subsector: combined_main_spec
  units: "monetary"
  units_description: "USD welfare cost per capita (DeltaWelfare / population, DeltaWelfare = DeltaCS + DeltaPS per paper Eq. K.1); negative = welfare loss"
  adaptation: fulladapt
  source_variable: "wc_no_reallocation"
  source_nc4_main: "disaggregated_damages.nc4"
  methodology_ref: "Agriculture main_spec (epsilon_S=0.1, epsilon_D=-0.04, country markets, ag-share GDP + 10% topcode, varietal switching, CO2 fert on, full adaptation); headline scenario for Tables S15/S16, Fig 3D"
  spec_notes: "wc = welfare cost, no_reallocation means no intra-sector reallocation of factors; disaggregation=True in raw file but wc_no_reallocation is the across-crop aggregate"

data:
  source: /scratch/midway3/cadavidsanchez/flex-damages/agval/full/agval_aggregated_full.parquet
  format: parquet

  columns:
    y: wc_no_reallocation
    temperature: temperature_anomaly
    income: gdppc
    weight: pop
    region: region
    year: year
    sdev: null
    scenario_columns:
      - rcp
      - ssp

  income_is_log: false

estimation:
  formula: "alpha * T + beta * T**2"

  gamma:
    method: fixed_effects
    temperature_bins: 0.5
    cluster_se: true
    include_sign_in_fe: true
    n_quantiles: 19
    trim_percentile: 0.05

  regional:
    min_observations: 10
    ridge_lambda: 1.0e-8

  # beta <= 0 (concavity). Losses accelerate at higher warming (convex loss
  # curve = concave welfare curve under DeltaWelfare sign convention).
  constraints:
    - parameter: beta
      type: max
      value: 0

output:
  results_dir: /project/cil/gcp/flex_damage_funcs/results/agriculture_value/combined_main_spec
  parameters_dir: /project/cil/gcp/flex_damage_funcs/parameters

execution:
  workers: 0
  memory_limit_gb: 100
